<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#183451">
<link rel="manifest" href="/admin.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VIZELLO Admin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Luckiest+Guy&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<script>try{var _t=localStorage.getItem('vz-theme');if(_t==='dark'||_t==='light')document.documentElement.setAttribute('data-theme',_t);}catch(e){}</script>
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<script src="/vendor/leaflet/leaflet.js"></script>
<title>VIZELLO — Admin</title>
<style>
  /* tokens de cor e modo escuro em /theme.css (compartilhado com o app do morador) */
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;scrollbar-width:none;-ms-overflow-style:none}
  *::-webkit-scrollbar{display:none;width:0;height:0}
  /* mapa (Leaflet) */
  .mapwrap{position:fixed;inset:0;z-index:80;background:var(--surface);display:none;flex-direction:column}
  .mapwrap.show{display:flex}
  .maphead{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;background:var(--bg);color:#eaf3f7}
  .maphead h2{font-size:17px;margin:0;flex:1;font-weight:700}
  .maphead .mapclose{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.15);color:#fff;display:grid;place-items:center;font-size:16px;flex:0 0 auto}
  #mapEl{flex:1;width:100%;background:#dfe6ea}
  .mapfoot{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
  .mapfoot .hint{flex:1;font-size:13px;color:var(--muted)}
  .leaflet-container{font:inherit}
  /* relatório imprimível */
  .relwrap{position:fixed;inset:0;z-index:90;background:var(--app-bg);overflow-y:auto;display:none}
  .relwrap.show{display:block}
  .relbar{position:sticky;top:0;display:flex;gap:10px;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;background:var(--bg);z-index:2}
  .reldoc{max-width:760px;margin:16px auto 40px;background:#fff;padding:32px;box-shadow:var(--shadow);border-radius:10px}
  .relhead{display:flex;align-items:center;gap:14px;border-bottom:2px solid var(--bg);padding-bottom:16px;margin-bottom:8px}
  .relhead h1{font-size:20px;margin:0} .relhead p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .reldoc h2{font-size:15px;margin:22px 0 8px;color:var(--brand-ink)}
  .relgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .relgrid>div{background:var(--chip);border-radius:10px;padding:10px 12px}
  .relgrid small{display:block;color:var(--brand-ink);font-size:11.5px} .relgrid b{font-size:18px;color:var(--ink)}
  .reldoc table{width:100%;border-collapse:collapse;font-size:13.5px}
  .reldoc th,.reldoc td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
  .reldoc th{color:var(--muted);font-weight:700}
  .relfoot{margin-top:24px;color:var(--muted);font-size:12px;text-align:center}
  @media print{
    body{background:#fff}
    body *{visibility:hidden}
    #relWrap,#relWrap *{visibility:visible}
    #relWrap{position:absolute;inset:0;overflow:visible;background:#fff}
    .relnoprint{display:none!important}
    .reldoc{box-shadow:none;margin:0;max-width:100%;padding:0}
  }
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
  html,body{margin:0;min-height:100%}
  body{font-family:'Inter',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--app-bg)}
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select{font:inherit}
  input[type="date"],input[type="time"],input[type="datetime-local"],input[type="month"]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;min-height:46px}
  a{color:var(--brand-ink)}
  .hide{display:none!important}
  /* ===== responsividade global ===== */
  html,body{max-width:100%;overflow-x:hidden}
  img,svg,video,canvas{max-width:100%;height:auto}
  input,textarea,select{max-width:100%}
  pre,code,textarea{overflow-wrap:anywhere;word-break:break-word}
  .scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
  @media(max-width:400px){ .metrics,.mini{grid-template-columns:1fr!important} }

  /* login */
  /* flex + margin:auto centra o cartão nos dois eixos e rola sem cortar
     o topo quando a tela é baixa (paisagem / teclado aberto) */
  .center{min-height:100dvh;display:flex;padding:24px;overflow-y:auto;background:linear-gradient(165deg,#12586b 0%,#0e4a5a 46%,#0a3644 100%)}
  .card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);width:100%;max-width:400px;padding:26px;margin:auto}
  /* logo (nova) nos cartões de login/recuperação */
  .loginlogo{display:block;margin:2px auto 6px;width:190px;max-width:70%;height:auto}
  .center .brand.tagline{justify-content:center;margin-bottom:4px}
  .center .brand.tagline .tag{font-size:11px;font-weight:800;background:var(--ink);color:#fff;padding:3px 10px;border-radius:999px;letter-spacing:1px}
  @media(min-width:681px){ .center .card{max-width:420px;padding:32px} }
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;color:var(--ink);letter-spacing:-.3px}
  .center .brand{justify-content:center}
  .wordmark{font-family:'Luckiest Guy',Inter,system-ui,cursive;font-weight:400;font-size:30px;letter-spacing:.5px;line-height:1;padding-top:3px;display:inline-flex}
  .wordmark i{font-style:normal;transform:rotate(var(--tw,0deg));transform-origin:50% 60%}
  .wordmark i:nth-child(1){color:var(--wm-orange);--tw:-4deg}
  .wordmark i:nth-child(2){color:var(--wm-gold);--tw:2deg}
  .wordmark i:nth-child(3){color:var(--wm-gold);--tw:-3deg}
  .wordmark i:nth-child(4){color:var(--wm-blue);--tw:3deg}
  .wordmark i:nth-child(5){color:var(--wm-navy);--tw:-2deg}
  .wordmark i:nth-child(6){color:var(--wm-orange);--tw:3deg}
  .wordmark i:nth-child(7){color:var(--wm-gold);--tw:-3deg}
  .brand .tag{font-size:11px;font-weight:800;background:var(--ink);color:#fff;padding:2px 8px;border-radius:999px;letter-spacing:.5px}
  .sub{color:var(--muted);font-size:14px;margin:6px 0 18px}
  label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:14px 0 6px}
  .field{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--field-bg);outline:none}
  .field:focus{border-color:var(--brand)}
  .btn{width:100%;padding:13px;border-radius:12px;background:var(--brand);color:#fff;font-weight:700;margin-top:18px;transition:filter .15s}
  .btn:active{filter:brightness(.93)} .btn:disabled{opacity:.55}
  .btn.secondary{background:var(--chip);color:var(--brand-ink)}
  .btn.ghost{background:transparent;color:var(--brand-ink);margin-top:8px;font-weight:600}
  .btn.small{width:auto;margin:0;padding:9px 15px;font-size:14px}
  .btn.danger{background:#fdecea;color:var(--danger)}
  .err{background:#fdecea;color:var(--danger);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:14px;display:none}
  .err.show{display:block}
  .ok{background:#e6f5ee;color:var(--ok);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:14px;display:none}
  .ok.show{display:block}

  /* shell */
  header.top{background:var(--bg);color:#eaf3f7;padding:16px 22px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
  header.top .brand{color:#eaf3f7}
  header.top .wordmark{--wm-navy:#eef4f8;font-size:24px}
  header.top .toplogo{height:34px;width:auto;display:block}
  header.top .brand .tag{font-size:10px;font-weight:800;background:rgba(255,255,255,.16);color:#eaf3f7;padding:3px 8px;border-radius:999px;letter-spacing:1px}
  header.top .who{margin-left:auto;text-align:right;font-size:13px;color:#9fc0cd}
  header.top .who b{display:block;color:#eaf3f7;font-size:14px}
  main{max-width:1000px;margin:0 auto;padding:22px 18px calc(96px + env(safe-area-inset-bottom))}
  /* bottom nav (padronizado com o app do morador) */
  nav.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:25}
  nav.bottom .navinner{max-width:1000px;margin:0 auto;display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
  nav.bottom button{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:clamp(9px,2.9vw,11px);font-weight:600;padding:6px 1px}
  nav.bottom button .ic{display:flex;align-items:center;justify-content:center;height:23px}
  nav.bottom button .ic svg{display:block}
  /* rótulo nunca quebra linha nem transborda: encolhe com reticências */
  nav.bottom button .lbl{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15;letter-spacing:-.2px}
  nav.bottom button.active{color:var(--brand)}
  @media(min-width:1040px){ nav.bottom button{font-size:12px} }
  .adsec{display:none} .adsec.on{display:block}
  /* integridade do sistema */
  .health-hero{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(15,43,61,.04)}
  .health-dot{width:14px;height:14px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 5px color-mix(in srgb,currentColor 22%,transparent)}
  .health-hero b{font-size:17px} .health-hero small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
  .st-ok{color:#1a8a5e} .st-warn{color:#b67d16} .st-fail{color:#cc4133}
  @media(prefers-color-scheme:dark){.st-ok{color:#3fb383}.st-warn{color:#d5a13f}.st-fail{color:#e2695c}}
  .chk{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
  .chk .cdot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;background:currentColor}
  .chk .cbody{flex:1;min-width:0} .chk .cbody b{font-size:14px;font-weight:600} .chk .cbody small{display:block;color:var(--muted);font-size:12.5px}
  .chk .cpill{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:3px 9px;border-radius:999px;border:1px solid currentColor}
  @media(min-width:1040px){ header.top{padding-left:max(22px,calc((100% - 1000px)/2));padding-right:max(22px,calc((100% - 1000px)/2))} }
  .h{font-size:20px;font-weight:800;margin:6px 2px 14px;letter-spacing:-.3px}
  .h small{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-top:2px}

  .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
  @media(max-width:640px){.metrics{grid-template-columns:1fr 1fr}}
  .metric{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 1px 2px rgba(15,43,61,.04)}
  .metric small{color:var(--muted);font-size:12.5px} .metric b{display:block;font-size:26px;margin-top:4px;letter-spacing:-.5px}

  .bar{display:flex;gap:10px;align-items:center;margin:2px 2px 12px;flex-wrap:wrap}
  .bar .search{flex:1;min-width:180px}
  .selfield{width:auto;min-width:150px;padding:10px 12px;margin:0;min-height:0}

  /* strip de insights derivados */
  .mini{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:-10px 0 22px}
  @media(max-width:640px){.mini{grid-template-columns:1fr 1fr}}
  .mini .m2{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
  .mini small{color:var(--muted);font-size:11.5px;display:block}
  .mini b{font-size:19px;letter-spacing:-.3px}
  .mini b.warn{color:var(--brand)}

  /* gráfico de crescimento */
  .chartcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:22px;box-shadow:0 1px 2px rgba(15,43,61,.04)}
  .chartcard .ct{font-size:13px;color:var(--muted);margin-bottom:14px}
  .bars{display:flex;align-items:stretch;gap:8px;height:96px}
  .bars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px}
  .bars .val{font-size:11px;font-weight:700;height:14px}
  .bars .bwrap{flex:1;display:flex;align-items:flex-end;width:100%}
  .bars .b{width:100%;background:var(--accent);border-radius:6px 6px 0 0;min-height:2px}
  .bars .b.zero{background:var(--line)}
  .bars .b.proj{background:var(--sand)}
  .bars .lbl{font-size:10.5px;color:var(--muted);text-transform:capitalize}
  /* legenda com marcador colorido */
  .meta .lg{display:inline-flex;align-items:center;gap:5px}
  .meta .lg i{width:11px;height:11px;border-radius:3px;display:inline-block}
  /* DRE: receita x despesa lado a lado */
  .dre-series{display:flex;align-items:flex-end;gap:8px;height:92px;margin-top:4px}
  .dre-series .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px}
  .dre-series .pair{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:3px;width:100%}
  .dre-series .rb,.dre-series .db{width:42%;min-height:2px;border-radius:4px 4px 0 0}
  .dre-series .rb{background:var(--accent)} .dre-series .db{background:var(--brand)}
  .dre-series .lbl{font-size:10.5px;color:var(--muted);text-transform:capitalize}

  /* segmentos (filtro) */
  .seg{display:inline-flex;background:var(--chip);border-radius:999px;padding:3px;gap:2px}
  .seg button{padding:7px 13px;border-radius:999px;font-size:13px;font-weight:600;color:var(--brand-ink)}
  .seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(15,43,61,.12)}

  /* card clicável + detalhe */
  .clickable{cursor:pointer;border-radius:12px;transition:background .12s;position:relative}
  .clickable:hover{background:#faf6ee}
  .detailhint{font-size:12px;font-weight:700;color:var(--brand);margin-top:8px;opacity:.85}
  .badge.warn2{background:#fdeee2;color:var(--brand)}
  .drow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  .drow:last-child{border-bottom:none}
  .drow .k{color:var(--muted)} .drow .v{font-weight:600;text-align:right}
  .dgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 4px}
  .dcard{background:var(--chip);border-radius:12px;padding:11px 13px}
  .dcard small{display:block;color:var(--brand-ink);font-size:11.5px} .dcard b{font-size:18px;color:var(--ink)}
  .dcard.bad b{color:var(--danger)}
  .dsec{margin-top:16px} .dsec .t{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}
  .personrow{display:flex;align-items:center;gap:8px;padding:7px 0;font-size:13.5px;border-bottom:1px solid var(--line)}
  .personrow:last-child{border-bottom:none}
  .personrow .rl{margin-left:auto;font-size:11px;font-weight:700;color:var(--brand-ink);background:var(--chip);padding:2px 8px;border-radius:999px}
  .auditrow{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
  .auditrow:last-child{border-bottom:none}
  .auditrow .aw{font-weight:600} .auditrow .at{margin-left:auto;color:var(--muted);font-size:12px;white-space:nowrap}
  .auditrow .ae{color:var(--muted);font-size:12px}
  .scrollbox{max-height:220px;overflow-y:auto}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(15,43,61,.04)}
  .tile .row{display:flex;align-items:center;gap:10px}
  .tile h3{margin:0;font-size:16px}
  .meta{color:var(--muted);font-size:12.5px;margin-top:8px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .badge{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--brand-ink)}
  .badge.ok{background:#e6f5ee;color:var(--ok)} .badge.off{background:#f0f0f0;color:#888}
  .badge.dngr{background:#fdecea;color:var(--danger)} .badge.trial{background:#eef2f6;color:#5a6b78}
  .empty{text-align:center;color:var(--muted);padding:40px 20px}
  .empty .big{font-size:40px}
  .spin{width:24px;height:24px;border:2.5px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp 1s linear infinite;margin:48px auto}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(9,25,35,.5);display:none;align-items:center;justify-content:center;z-index:40;padding:20px}
  .modal-bg.show{display:flex}
  .modal{background:var(--surface);width:100%;max-width:440px;border-radius:var(--r);padding:22px;box-shadow:var(--shadow);max-height:90dvh;overflow-y:auto}
  .modal h2{margin:0 0 4px;font-size:19px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:32px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
  .toast.show{opacity:1}
  .switch{cursor:pointer;width:46px;height:26px;border-radius:999px;background:#cdd8de;position:relative;transition:background .15s;flex:0 0 auto}
  .switch.on{background:var(--ok)}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
  .switch.on::after{left:23px}
  .chk-item{font-size:13.5px;padding:5px 0;line-height:1.45;color:var(--ink)}
  code{background:var(--chip);padding:1px 6px;border-radius:5px;font-size:12px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="center">
  <div class="card">
    <img class="loginlogo" src="/logo-dark.png?v=2" alt="VIZELLO">
    <div class="brand tagline"><span class="tag">ADMIN</span></div>
    <div class="sub" style="text-align:center">Painel de operação da plataforma.</div>
    <label>E-mail</label>
    <input id="email" class="field" type="email" autocomplete="email" placeholder="voce@empresa.com">
    <label>Senha</label>
    <input id="pass" class="field" type="password" autocomplete="current-password" placeholder="••••••••">
    <div id="loginErr" class="err"></div>
    <div id="loginMsg" class="ok"></div>
    <button id="loginBtn" class="btn">Entrar</button>
    <div style="text-align:center;margin-top:12px"><button id="forgotBtn" type="button" style="color:var(--brand-ink);font-weight:700">Esqueci minha senha</button></div>
  </div>
</div>

<!-- DEFINIR NOVA SENHA (recuperação) -->
<div id="reset" class="center hide">
  <div class="card">
    <img class="loginlogo" src="/logo-dark.png?v=2" alt="VIZELLO">
    <div class="brand tagline"><span class="tag">ADMIN</span></div>
    <div class="sub" style="margin-top:10px;text-align:center">Defina uma nova senha para sua conta.</div>
    <label>Nova senha</label>
    <input id="rsPass" class="field" type="password" autocomplete="new-password" placeholder="••••••••">
    <label>Confirmar nova senha</label>
    <input id="rsPass2" class="field" type="password" autocomplete="new-password" placeholder="••••••••">
    <div id="rsErr" class="err"></div>
    <div id="rsMsg" class="ok"></div>
    <button id="rsSave" class="btn">Salvar nova senha</button>
    <button id="rsCancel" class="btn ghost" type="button">Cancelar</button>
  </div>
</div>

<!-- SEM ACESSO -->
<div id="denied" class="center hide">
  <div class="card" style="text-align:center">
    <div class="brand" style="justify-content:center"><span class="logo">🔒</span> Acesso restrito</div>
    <div class="sub" style="margin-top:12px">Sua conta não é um operador da plataforma. Fale com um administrador para receber acesso.</div>
    <button id="deniedOut" class="btn ghost">Sair</button>
  </div>
</div>

<!-- 2FA OBRIGATÓRIO -->
<div id="force" class="center hide">
  <div class="card" id="forceCard"><div class="spin"></div></div>
</div>

<!-- APP -->
<div id="app" class="hide">
  <header class="top">
    <div class="brand"><img class="toplogo" src="/logo-white.png?v=2" alt="VIZELLO"> <span class="tag">ADMIN</span></div>
    <div class="who"><b id="whoName">—</b><span id="whoEmail">—</span></div>
    <button class="btn small secondary" id="logoutBtn" style="margin-left:14px">Sair</button>
  </header>
  <main id="view"><div class="spin"></div></main>
  <nav class="bottom" id="adminNav"></nav>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="mapwrap" id="mapWrap">
  <div class="maphead"><h2 id="mapTitle">Mapa</h2><button class="mapclose" id="mapClose" aria-label="Fechar">✕</button></div>
  <div id="mapEl"></div>
  <div class="mapfoot" id="mapFoot"></div>
</div>
<div class="relwrap" id="relWrap"></div>
<div class="toast" id="toast"></div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

// mesma config do app (publishable key é pública)
const SUPABASE_URL  = "https://bklvbhsaxcmrnjxjbzjh.supabase.co";
const SUPABASE_ANON = "sb_publishable_7ci7VKQf-aUPvfpckRhK9A_fRmf8JQa";
const sb = createClient(SUPABASE_URL, SUPABASE_ANON);

// --- Segurança do painel ---
const REQUIRE_2FA = true;   // operadores obrigados a ter 2FA ativo p/ acessar
const IDLE_MIN    = 30;     // logout automático após N min de inatividade

const S = { user:null };
const $ = s => document.querySelector(s);
const view = () => $("#view");
function esc(x){ return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2600); }
function modal(html){ $("#modal").innerHTML=html; $("#modalBg").classList.add("show"); }
function closeModal(){ $("#modalBg").classList.remove("show"); const f=S._onClose; S._onClose=null; if(f) f(); }
// script é type="module": expõe closeModal no escopo global p/ os onclick="closeModal()" inline
window.closeModal = closeModal;
$("#modalBg").addEventListener("click",e=>{ if(e.target.id==="modalBg") closeModal(); });
// confirmação com modal próprio (substitui o confirm() nativo)
function confirmar(msg,{danger=false,ok="Confirmar"}={}){
  return new Promise(res=>{
    const done=v=>{ S._onClose=null; closeModal(); res(v); };
    modal(`<h2>Confirmar</h2><p class="sub">${esc(msg)}</p>
      <div style="display:flex;gap:10px;margin-top:10px">
        <button class="btn secondary" id="cfNo">Cancelar</button>
        <button class="btn ${danger?"danger":""}" id="cfYes">${esc(ok)}</button></div>`);
    $("#cfYes").addEventListener("click",()=>done(true));
    $("#cfNo").addEventListener("click",()=>done(false));
    S._onClose=()=>res(false);
  });
}
async function rpc(fn,args){ const {data,error}=await sb.rpc(fn,args); if(error){ if(fn!=="log_evento") logEvento("error","rpc:"+fn,error.message,{code:error.code}); throw error; } return data; }
// ---- Observabilidade (best-effort) ----
const _logDedup=new Set();
async function logEvento(nivel,contexto,mensagem,detalhe){
  try{
    if(!S.user) return;
    const key=(contexto||"")+"|"+String(mensagem||"").slice(0,120);
    if(_logDedup.has(key)) return; _logDedup.add(key); setTimeout(()=>_logDedup.delete(key),60000);
    await sb.rpc("log_evento",{p_nivel:nivel||"error",p_contexto:contexto||null,p_mensagem:String(mensagem||"").slice(0,500),p_detalhe:detalhe||null,p_url:(location.hash||location.pathname||"").slice(0,300),p_app:"admin",p_cond:null});
  }catch(_){}
}
window.addEventListener("error",e=>{ logEvento("error","window.onerror",e.message||"erro",{src:e.filename,line:e.lineno}); });
window.addEventListener("unhandledrejection",e=>{ const r=e.reason; logEvento("error","unhandledrejection",(r&&(r.message||r))||"promise rejeitada",(r&&r.stack)?{stack:String(r.stack).slice(0,400)}:null); });
function fmtDate(iso){ return iso? new Date(iso).toLocaleDateString("pt-BR") : ""; }
function fmtMoney(v){ return (Number(v)||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"}); }
function fmtDateTime(iso){ return iso? new Date(iso).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"}) : "—"; }
function tempoRel(iso){ if(!iso) return "nunca"; const d=(Date.now()-new Date(iso).getTime())/86400000;
  if(d<1) return "hoje"; if(d<2) return "ontem"; if(d<30) return `há ${Math.floor(d)} dias`; return fmtDate(iso); }
const ROLE_LABEL={super_admin:"Dono",sindico:"Síndico",conselho:"Conselho",portaria:"Portaria",morador:"Morador"};
const ACAO_LABEL={condominio_criar:"Criou condomínio",condominio_editar:"Editou dados",condominio_suspender:"Suspendeu",
  condominio_reativar:"Reativou",sindico_definir:"Definiu síndico",operador_add:"Adicionou operador",operador_remove:"Removeu operador"};

function show(id){ for(const s of ["login","reset","denied","force","app"]) $("#"+s).classList.toggle("hide", s!==id); }

// ---------- AUTH ----------
function loginErr(m){ const e=$("#loginErr"); if(!m){e.classList.remove("show");return;} e.textContent=m; e.classList.add("show"); }
function loginMsg(m){ const e=$("#loginMsg"); if(!m){e.classList.remove("show");return;} e.textContent=m; e.classList.add("show"); }
$("#loginBtn").addEventListener("click", async ()=>{
  const email=$("#email").value.trim(), pass=$("#pass").value;
  if(!email||!pass){ loginErr("Preencha e-mail e senha."); return; }
  $("#loginBtn").disabled=true; loginErr("");
  try{
    const {error}=await sb.auth.signInWithPassword({email,password:pass});
    if(error) throw error;
    await boot();
  }catch(e){
    const m=(e?.message||"").toLowerCase();
    loginErr(m.includes("invalid login")?"E-mail ou senha incorretos.":(e?.message||"Erro ao entrar."));
  }
  $("#loginBtn").disabled=false;
});
$("#pass").addEventListener("keydown",e=>{ if(e.key==="Enter") $("#loginBtn").click(); });

// ---------- Esqueci minha senha ----------
$("#forgotBtn")?.addEventListener("click", async ()=>{
  const email=$("#email").value.trim();
  if(!email){ loginErr("Digite seu e-mail acima e toque em \"Esqueci minha senha\"."); return; }
  loginErr(""); loginMsg(""); $("#forgotBtn").disabled=true;
  try{
    const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
    if(error) throw error;
    loginMsg("Enviamos um link para "+email+". Abra o e-mail para redefinir a senha.");
  }catch(e){ const m=(e?.message||"").toLowerCase(); loginErr(m.includes("rate")||m.includes("too many")?"Muitas tentativas. Aguarde alguns minutos.":(e?.message||"Erro ao enviar.")); }
  $("#forgotBtn").disabled=false;
});
// ---------- Definir nova senha ----------
function rsErr(m){ const e=$("#rsErr"); if(!m){e.classList.remove("show");return;} e.textContent=m; e.classList.add("show"); }
function rsMsg(m){ const e=$("#rsMsg"); if(!m){e.classList.remove("show");return;} e.textContent=m; e.classList.add("show"); }
$("#rsSave")?.addEventListener("click", async ()=>{
  const p1=$("#rsPass").value, p2=$("#rsPass2").value;
  if(!p1||p1.length<6){ rsErr("A senha precisa ter ao menos 6 caracteres."); return; }
  if(p1!==p2){ rsErr("As senhas não conferem."); return; }
  rsErr(""); $("#rsSave").disabled=true;
  try{
    const {error}=await sb.auth.updateUser({password:p1});
    if(error) throw error;
    rsMsg("Senha atualizada! Entrando…");
    setTimeout(()=>boot().catch(e=>console.error(e)),700);
  }catch(e){ rsErr(e?.message||"Erro ao salvar."); $("#rsSave").disabled=false; }
});
$("#rsCancel")?.addEventListener("click", async ()=>{ try{ await sb.auth.signOut(); }catch(_){} location.hash=""; show("login"); });
sb.auth.onAuthStateChange((event)=>{ if(event==="PASSWORD_RECOVERY"){ rsErr(""); rsMsg(""); $("#rsPass").value=""; $("#rsPass2").value=""; show("reset"); } });

async function logout(){ pararIdle(); await sb.auth.signOut(); S.user=null; show("login"); }
$("#logoutBtn").addEventListener("click",logout);
$("#deniedOut").addEventListener("click",logout);

// ---------- TIMEOUT DE INATIVIDADE ----------
let idleTimer=null, lastAct=0;
function resetIdle(){ clearTimeout(idleTimer); idleTimer=setTimeout(idleLogout, IDLE_MIN*60*1000); }
function pararIdle(){ clearTimeout(idleTimer); idleTimer=null; }
async function idleLogout(){
  if(!S.user) return;
  pararIdle(); await sb.auth.signOut(); S.user=null; show("login");
  loginErr(`Sessão encerrada por inatividade (${IDLE_MIN} min). Entre novamente.`);
}
function onActivity(){ if(!S.user||!idleTimer) return; const n=Date.now(); if(n-lastAct<5000) return; lastAct=n; resetIdle(); }
["click","keydown","mousemove","touchstart","scroll"].forEach(ev=>document.addEventListener(ev,onActivity,{passive:true}));

// ---------- BOOT ----------
async function boot(){
  const {data:{user}} = await sb.auth.getUser();
  if(!user){ show("login"); return; }
  if(await mfaPendente()){ showAdminMfa(); return; }
  S.user=user;
  let ok=false;
  try{ ok = await rpc("plataforma_sou_admin"); }catch(_){ ok=false; }
  if(!ok){ show("denied"); return; }
  if(REQUIRE_2FA && !(await temTotpVerificado())){ showForce2FA(); return; }
  $("#whoName").textContent="Olá, "+(user.user_metadata?.nome||user.email?.split("@")[0]||"Operador"); $("#whoEmail").textContent="";
  show("app");
  resetIdle();
  await renderDashboard();
}

// ---------- MFA / 2FA ----------
async function mfaPendente(){
  try{ const {data}=await sb.auth.mfa.getAuthenticatorAssuranceLevel(); return !!data && data.currentLevel==="aal1" && data.nextLevel==="aal2"; }
  catch(_){ return false; }
}
async function temTotpVerificado(){
  try{ const {data}=await sb.auth.mfa.listFactors(); return (data?.totp||[]).some(x=>x.status==="verified"); }
  catch(_){ return false; }
}
// 2FA obrigatório: bloqueia o painel até o operador ativar (enroll + verify)
async function showForce2FA(){
  show("force");
  const card=$("#forceCard"); card.innerHTML='<div class="spin"></div>';
  try{
    const {data:f}=await sb.auth.mfa.listFactors();
    for(const x of (f?.all||[])) if(x.factor_type==="totp" && x.status!=="verified"){ try{ await sb.auth.mfa.unenroll({factorId:x.id}); }catch(_){} }
    const {data,error}=await sb.auth.mfa.enroll({factorType:"totp",friendlyName:"CondoAdmin "+Date.now()});
    if(error) throw error;
    const factorId=data.id, qr=data.totp.qr_code, secret=data.totp.secret;
    card.innerHTML=`<img class="loginlogo" src="/logo-dark.png?v=2" alt="VIZELLO"><div class="brand tagline"><span class="tag">ADMIN</span></div>
      <div class="sub" style="text-align:center">🔐 Segurança obrigatória: ative a verificação em duas etapas para acessar o painel.</div>
      <div style="display:flex;justify-content:center;margin:10px 0"><img src="${qr.replace(/"/g,"&quot;")}" style="width:190px;height:190px;background:#fff;border-radius:10px"></div>
      <p class="sub" style="text-align:center;word-break:break-all">ou digite a chave no app: <b>${esc(secret)}</b></p>
      <label>Código do app autenticador</label>
      <input id="fCode" class="field" inputmode="numeric" maxlength="6" placeholder="000000" style="font-size:22px;letter-spacing:8px;text-align:center">
      <div id="fErr" class="err"></div>
      <button class="btn" id="fOk">Ativar e entrar</button>
      <button class="btn ghost" id="fSair">Sair</button>`;
    $("#fSair").addEventListener("click",logout);
    const go=async()=>{
      const code=$("#fCode").value.trim(); if(code.length<6) return;
      $("#fOk").disabled=true; $("#fErr").classList.remove("show");
      try{ const {data:ch,error:e1}=await sb.auth.mfa.challenge({factorId}); if(e1) throw e1;
        const {error:e2}=await sb.auth.mfa.verify({factorId,challengeId:ch.id,code}); if(e2) throw e2;
        await boot();
      }catch(_){ $("#fOk").disabled=false; const e=$("#fErr"); e.textContent="Código inválido. Tente de novo."; e.classList.add("show"); }
    };
    $("#fOk").addEventListener("click",go);
    $("#fCode").addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
  }catch(e){
    card.innerHTML=`<p class="empty">Falha ao iniciar o 2FA: ${esc(e.message||"erro")}</p><button class="btn ghost" id="fSair2">Sair</button>`;
    $("#fSair2").addEventListener("click",logout);
  }
}
async function showAdminMfa(){
  show("login");
  let factorId=null;
  try{ const {data}=await sb.auth.mfa.listFactors(); factorId=(data?.totp||[]).find(f=>f.status==="verified")?.id; }catch(_){}
  if(!factorId){ S.user=(await sb.auth.getUser()).data.user; const ok=await rpc("plataforma_sou_admin").catch(()=>false); if(!ok){ show("denied"); return; } $("#whoName").textContent="Olá, "+(S.user.user_metadata?.nome||S.user.email?.split("@")[0]||"Operador"); $("#whoEmail").textContent=""; show("app"); await renderDashboard(); return; }
  modal(`<h2>Verificação em duas etapas</h2><p class="sub">Digite o código do seu app autenticador.</p>
    <input id="amCode" class="field" inputmode="numeric" maxlength="6" placeholder="000000" style="font-size:22px;letter-spacing:8px;text-align:center">
    <div id="amErr" class="err"></div>
    <div style="display:flex;gap:10px;margin-top:12px"><button class="btn secondary" id="amSair">Sair</button><button class="btn" id="amOk">Confirmar</button></div>`);
  $("#amSair").addEventListener("click",()=>{ closeModal(); logout(); });
  const go2=async()=>{
    const code=$("#amCode").value.trim(); if(code.length<6) return;
    $("#amOk").disabled=true; $("#amErr").classList.remove("show");
    try{ const {data:ch,error:e1}=await sb.auth.mfa.challenge({factorId}); if(e1) throw e1;
      const {error:e2}=await sb.auth.mfa.verify({factorId,challengeId:ch.id,code}); if(e2) throw e2;
      closeModal(); await boot();
    }catch(_){ $("#amOk").disabled=false; const e=$("#amErr"); e.textContent="Código inválido. Tente de novo."; e.classList.add("show"); }
  };
  $("#amOk").addEventListener("click",go2);
  $("#amCode").addEventListener("keydown",e=>{ if(e.key==="Enter") go2(); });
}
async function ativarMFAAdmin(){
  try{
    const {data:f}=await sb.auth.mfa.listFactors();
    for(const x of (f?.all||[])) if(x.factor_type==="totp" && x.status!=="verified"){ try{ await sb.auth.mfa.unenroll({factorId:x.id}); }catch(_){} }
    const {data,error}=await sb.auth.mfa.enroll({factorType:"totp",friendlyName:"CondoAdmin "+Date.now()});
    if(error) throw error;
    const factorId=data.id, qr=data.totp.qr_code, secret=data.totp.secret;
    modal(`<h2>Ativar 2FA</h2><p class="sub">Escaneie o QR no seu app autenticador e digite o código.</p>
      <div style="display:flex;justify-content:center;margin:10px 0"><img src="${qr.replace(/"/g,"&quot;")}" style="width:190px;height:190px;background:#fff;border-radius:10px"></div>
      <p class="sub" style="text-align:center;word-break:break-all">ou a chave: <b>${esc(secret)}</b></p>
      <label>Código</label><input id="ameCode" class="field" inputmode="numeric" maxlength="6" placeholder="000000" style="font-size:22px;letter-spacing:8px;text-align:center">
      <div id="ameErr" class="err"></div>
      <div style="display:flex;gap:10px;margin-top:12px"><button class="btn secondary" id="ameCancel">Cancelar</button><button class="btn" id="ameOk">Ativar</button></div>`);
    $("#ameCancel").addEventListener("click",closeModal);
    $("#ameOk").addEventListener("click",async()=>{
      const code=$("#ameCode").value.trim(); if(code.length<6) return;
      $("#ameOk").disabled=true; $("#ameErr").classList.remove("show");
      try{ const {data:ch,error:e1}=await sb.auth.mfa.challenge({factorId}); if(e1) throw e1;
        const {error:e2}=await sb.auth.mfa.verify({factorId,challengeId:ch.id,code}); if(e2) throw e2;
        closeModal(); toast("2FA ativado 🔐"); renderDashboard();
      }catch(_){ $("#ameOk").disabled=false; const e=$("#ameErr"); e.textContent="Código inválido."; e.classList.add("show"); }
    });
  }catch(e){ toast(e.message||"Falha ao ativar 2FA"); }
}
async function desativarMFA(){
  try{ const {data:f}=await sb.auth.mfa.listFactors();
    for(const x of (f?.all||[])) if(x.factor_type==="totp"){ try{ await sb.auth.mfa.unenroll({factorId:x.id}); }catch(_){} }
    toast("2FA desativado"); renderDashboard();
  }catch(e){ toast(e.message||"Falha"); }
}

// ---------- DASHBOARD ----------
async function renderDashboard(){
  view().innerHTML='<div class="spin"></div>';
  let m={}, conds=[], admins=[], audit=[], fat={}, planos=[], broadcasts=[], tickets=[], rel={}, mensal=[], dre={}, despesas=[], imobs=[];
  try{
    [m,conds,admins,audit,fat,planos,broadcasts,tickets,rel,mensal,dre,despesas,imobs] = await Promise.all([
      rpc("plataforma_metricas"), rpc("plataforma_condominios"), rpc("plataforma_admins_listar"),
      rpc("plataforma_audit_listar",{p_limit:20}).catch(()=>[]),
      rpc("plataforma_faturamento").catch(()=>({})),
      rpc("plataforma_planos_listar").catch(()=>[]),
      rpc("plataforma_broadcasts_listar",{p_limit:10}).catch(()=>[]),
      rpc("plataforma_tickets_listar").catch(()=>[]),
      rpc("plataforma_relatorio").catch(()=>({})),
      rpc("plataforma_mensalidades").catch(()=>[]),
      rpc("plataforma_dre",{p_meses:6}).catch(()=>({})),
      rpc("plataforma_despesas_listar").catch(()=>[]),
      rpc("plataforma_imobiliarias").catch(()=>[])
    ]);
  }catch(e){ view().innerHTML=`<p class="empty">Erro: ${esc(e.message)}</p>`; return; }
  S._planos=planos; S._rel=rel;
  S._fin={ fat, rel, mensal, dre, despesas };
  const me = admins.find(a=>a.user_id===S.user.id);
  $("#whoName").textContent="Olá, "+(me?.nome||S.user.email?.split("@")[0]||"Operador");
  S._papel = me?.papel || "admin"; S._suporte = S._papel==="suporte";
  $("#whoRole")?.remove();
  if(S._suporte){ const w=document.querySelector("header.top .who"); if(w) w.insertAdjacentHTML("beforeend",'<span id="whoRole" class="badge" style="display:inline-block;margin-top:3px">Suporte · somente leitura</span>'); }
  let mfaOn=false; try{ const {data:mf}=await sb.auth.mfa.listFactors(); mfaOn=(mf?.totp||[]).some(x=>x.status==="verified"); }catch(_){}

  // ---- insights derivados (sem backend) ----
  const now=new Date();
  const suspensos = conds.filter(c=>!c.ativo).length;
  const semSindico = conds.filter(c=>!(c.sindicos&&c.sindicos.length)).length;
  const novosMes = conds.filter(c=>{ const d=new Date(c.created_at); return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth(); }).length;
  const mediaUn = conds.length ? Math.round(conds.reduce((s,c)=>s+(c.unidades||0),0)/conds.length) : 0;

  let html=`<section class="adsec" data-ad="inicio">
    <div class="metrics">
      <div class="metric"><small>Condomínios</small><b>${m.condominios||0}</b></div>
      <div class="metric"><small>Ativos</small><b>${m.condominios_ativos||0}</b></div>
      <div class="metric"><small>Unidades</small><b>${m.unidades||0}</b></div>
      <div class="metric"><small>Usuários</small><b>${m.usuarios||0}</b></div>
    </div>
    <div class="mini">
      <div class="m2"><small>Suspensos</small><b class="${suspensos?"warn":""}">${suspensos}</b></div>
      <div class="m2"><small>Sem síndico</small><b class="${semSindico?"warn":""}">${semSindico}</b></div>
      <div class="m2"><small>Novos no mês</small><b>${novosMes}</b></div>
      <div class="m2"><small>Média un./cond.</small><b>${mediaUn}</b></div>
    </div>
    <div class="h">🏘️ Imobiliárias <small>Assinaturas da vertical de locação</small></div>
    <div class="mini">
      <div class="m2"><small>Imobiliárias</small><b>${m.imobiliarias||0}</b></div>
      <div class="m2"><small>Imóveis (locados)</small><b>${m.imob_imoveis||0} <small style="font-weight:600;color:var(--muted)">(${m.imob_locados||0})</small></b></div>
      <div class="m2"><small>MRR imobiliárias</small><b>${fmtMoney(fat.mrr_imobiliarias)}</b></div>
      <div class="m2"><small>Sem plano</small><b class="${fat.sem_assinatura_imob?"warn":""}">${fat.sem_assinatura_imob||0}</b></div>
    </div>
    <div class="h">Faturamento <small>Assinaturas dos condomínios</small></div>
    <div class="mini">
      <div class="m2"><small>MRR (ativas)</small><b>${fmtMoney(fat.mrr)}</b></div>
      <div class="m2"><small>Em risco (atrasadas)</small><b class="${fat.atrasadas?"warn":""}">${fmtMoney(fat.receita_risco)}</b></div>
      <div class="m2"><small>Em trial</small><b>${fat.trial||0}</b></div>
      <div class="m2"><small>Sem plano</small><b class="${fat.sem_assinatura?"warn":""}">${fat.sem_assinatura||0}</b></div>
    </div>
    ${(fat.por_plano&&fat.por_plano.length)?`<div class="meta" style="margin:-8px 2px 20px">${fat.por_plano.map(p=>`<span>${esc(p.plano)}: <b style="color:var(--ink)">${p.qtd}</b> · ${fmtMoney(p.receita)}</span>`).join("")}</div>`:""}
    ${mrrChart(rel.mrr_serie||[])}
    <div class="h">Atendimento <small>Tempo de resposta dos chamados</small></div>
    <div class="mini">
      <div class="m2"><small>Chamados</small><b>${(rel.tickets&&rel.tickets.total)||0}</b></div>
      <div class="m2"><small>Abertos</small><b class="${(rel.tickets&&rel.tickets.abertos)?"warn":""}">${(rel.tickets&&rel.tickets.abertos)||0}</b></div>
      <div class="m2"><small>1ª resposta (méd)</small><b>${fmtHoras(rel.tickets&&rel.tickets.tempo_resposta_h)}</b></div>
      <div class="m2"><small>Resolução (méd)</small><b>${fmtHoras(rel.tickets&&rel.tickets.tempo_resolucao_h)}</b></div>
    </div>
    <div class="bar"><button class="btn small secondary" id="btnRelatorio">📄 Gerar relatório (PDF)</button></div>
    ${growthChart(conds)}

async function drawIntegridade(){
  const wrap=$("#healthWrap"); if(!wrap) return;
  wrap.innerHTML='<div class="spin"></div>';
  const t0=performance.now(); let h=null, err=null, lat=null;
  try{ h=await rpc("plataforma_saude"); lat=Math.round(performance.now()-t0); }
  catch(e){ err=e.message||"erro"; }
  if(err){ wrap.innerHTML=`<div class="chk st-fail"><span class="cdot"></span><div class="cbody"><b>Falha ao consultar a saúde do sistema</b><small>${esc(err)}</small></div><span class="cpill">FALHA</span></div>`; return; }
  const m=h.metricas||{}, seg=h.seguranca||{}, checks=h.checagens||[];
  const rank={ok:0,warn:1,fail:2}; let worst="ok";
  checks.forEach(c=>{ if((rank[c.status]??1)>rank[worst]) worst=c.status; });
  const latStatus = lat==null?"warn":(lat<600?"ok":(lat<1500?"warn":"fail"));
  if(rank[latStatus]>rank[worst]) worst=latStatus;
  const heroCls={ok:"st-ok",warn:"st-warn",fail:"st-fail"}[worst];
  const heroLbl={ok:"Tudo operacional",warn:"Atenção em alguns pontos",fail:"Ação necessária"}[worst];
  const STLBL={ok:"OK",warn:"Atenção",fail:"Falha"};
  const stCls={ok:"st-ok",warn:"st-warn",fail:"st-fail"};
  $("#saudeAt").textContent="Atualizado "+fmtDateTime(h.gerado_em);

  let out=`<div class="health-hero ${heroCls}"><span class="health-dot"></span>
    <div><b>${heroLbl}</b><small>Latência do banco: ${lat} ms · ${seg.tabelas_rls}/${seg.tabelas} tabelas com RLS · ${seg.funcoes} funções no servidor</small></div></div>`;

  out+=`<div class="metrics">
    <div class="metric"><small>Condomínios ativos</small><b>${m.condominios_ativos||0}</b></div>
    <div class="metric"><small>Usuários</small><b>${m.usuarios||0}</b></div>
    <div class="metric"><small>Assinaturas de push</small><b>${m.push_subscriptions||0}</b></div>
    <div class="metric"><small>Notificações (24h)</small><b>${m.notificacoes_24h||0}</b></div>
  </div>`;
  out+=`<div class="mini">
    <div class="m2"><small>Unidades</small><b>${m.unidades||0}</b></div>
    <div class="m2"><small>SOS ativos</small><b class="${m.sos_ativos?"warn":""}">${m.sos_ativos||0}</b></div>
    <div class="m2"><small>Cobranças vencidas</small><b class="${m.cobrancas_vencidas?"warn":""}">${m.cobrancas_vencidas||0}</b></div>
    <div class="m2"><small>Chamados abertos</small><b class="${m.tickets_abertos?"warn":""}">${m.tickets_abertos||0}</b></div>
  </div>`;

  out+=`<div class="h" style="margin-top:8px">Checagens</div>`;
  const latChk={status:latStatus,nome:"Conexão com o banco de dados",detalhe:(lat!=null?lat+" ms de resposta":"sem medição")};
  out+=[latChk,...checks].map(c=>{
    const k=stCls[c.status]||"st-warn";
    return `<div class="chk ${k}"><span class="cdot"></span>
      <div class="cbody"><b>${esc(c.nome)}</b><small>${esc(c.detalhe||"")}</small></div>
      <span class="cpill">${STLBL[c.status]||esc(c.status)}</span></div>`;
  }).join("");

  // ---- Erros recentes do app (observabilidade) ----
  let logs=null; try{ logs=await rpc("plataforma_logs_listar",{p_limit:40}); }catch(_){}
  if(logs){
    const e24=logs.erros_24h||0, e1=logs.erros_1h||0, itens=logs.itens||[];
    const alerta = e1>0 || e24>=10;
    out+=`<div class="h" style="margin-top:22px">Erros do app <small>Rastreio de erros do cliente (30 dias)</small></div>`;
    out+=`<div class="metrics" style="grid-template-columns:repeat(3,1fr);margin-bottom:16px">
      <div class="metric"><small>Última 1h</small><b class="${e1?"warn":""}">${e1}</b></div>
      <div class="metric"><small>Últimas 24h</small><b class="${alerta?"warn":""}">${e24}</b></div>
      <div class="metric"><small>Status</small><b style="font-size:18px;color:${alerta?"var(--danger)":"var(--ok)"}">${alerta?"⚠️ Investigar":"✅ Estável"}</b></div></div>`;
    if(!itens.length) out+=`<div class="chartcard"><p class="sub" style="margin:0">Nenhum erro registrado. 🎉</p></div>`;
    else out+=`<div class="chartcard"><div class="scrollbox" style="max-height:340px">${itens.map(l=>{
      const col=/fatal|error|onerror|unhandled/i.test((l.nivel||"")+" "+(l.contexto||""))?"var(--danger)":(l.nivel==="warn"?"#b67d16":"var(--ok)");
      return `<div class="auditrow"><span style="width:9px;height:9px;border-radius:50%;background:${col};flex:0 0 auto;align-self:center"></span>
      <div style="flex:1;min-width:0"><b>${esc(l.contexto||l.nivel||"erro")}</b> <span class="ae">${esc((l.mensagem||"").slice(0,140))}</span>
        <div class="ae">${esc(l.app||"")}${l.email?" · "+esc(l.email):""}${l.url?" · "+esc(l.url):""}</div></div>
      <span class="at">${esc(tempoRel(l.created_at))}</span></div>`;}).join("")}</div></div>`;
  }

  wrap.innerHTML=out;
}

// filtro + busca + ordenação (client-side)
function applyFilters(){
  let list=(S._conds||[]).slice();
  if(S._q) list=list.filter(c=>(c.nome||"").toLowerCase().includes(S._q)||(c.cidade||"").toLowerCase().includes(S._q));
  if(S._filter==="ativos") list=list.filter(c=>c.ativo);
  else if(S._filter==="suspensos") list=list.filter(c=>!c.ativo);
  const s=S._sort;
  list.sort((a,b)=> s==="nome" ? (a.nome||"").localeCompare(b.nome||"","pt")
    : s==="unidades" ? (b.unidades-a.unidades)
    : s==="membros" ? (b.membros-a.membros)
    : new Date(b.created_at)-new Date(a.created_at));
  const cc=$("#condCount"); if(cc) cc.textContent=`${list.length} de ${(S._conds||[]).length}`;
  drawConds(list);
}

// gráfico: novos condomínios por mês (últimos 8 meses)
function growthChart(conds){
  const now=new Date(), months=[];
  for(let i=7;i>=0;i--){ const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    months.push({y:d.getFullYear(),m:d.getMonth(),count:0,label:d.toLocaleDateString("pt-BR",{month:"short"}).replace(".","")}); }
  conds.forEach(c=>{ const d=new Date(c.created_at); const slot=months.find(x=>x.y===d.getFullYear()&&x.m===d.getMonth()); if(slot) slot.count++; });
  const max=Math.max(1,...months.map(x=>x.count));
  return `<div class="chartcard"><div class="ct">📈 Novos condomínios por mês</div><div class="bars">${
    months.map(x=>`<div class="col"><div class="val">${x.count||""}</div>
      <div class="bwrap"><div class="b ${x.count?"":"zero"}" style="height:${x.count?Math.round(x.count/max*100):0}%"></div></div>
      <div class="lbl">${esc(x.label)}</div></div>`).join("")}</div></div>`;
}
function fmtHoras(h){ if(h==null) return "—"; h=Number(h); return h<24?`${h}h`:`${(h/24).toFixed(1)}d`; }
function mesLabel(ym){ const p=(ym||"").split("-"); if(p.length<2) return ym||""; return new Date(+p[0],+p[1]-1,1).toLocaleDateString("pt-BR",{month:"short"}).replace(".",""); }
function mrrChart(serie){
  if(!serie||!serie.length) return "";
  const max=Math.max(1,...serie.map(x=>Number(x.mrr)||0));
  return `<div class="chartcard"><div class="ct">📈 MRR por mês <small style="color:var(--muted)">(reconstruído)</small></div><div class="bars">${
    serie.map(x=>{ const v=Number(x.mrr)||0; return `<div class="col"><div class="val" style="font-size:9px">${v?("R$"+Math.round(v)):""}</div>
      <div class="bwrap"><div class="b ${v?"":"zero"}" style="height:${v?Math.round(v/max*100):0}%"></div></div>
      <div class="lbl">${esc(mesLabel(x.mes))}</div></div>`; }).join("")}</div></div>`;
}

function projChart(){
  const f=S._fin||{}, serie=(f.rel&&f.rel.mrr_serie)||[], mrr=(f.fat&&f.fat.mrr)||0;
  const hist=serie.map(x=>({label:mesLabel(x.mes), v:Number(x.mrr)||0, proj:false}));
  const now=new Date(), fut=[];
  for(let i=1;i<=6;i++){ const d=new Date(now.getFullYear(),now.getMonth()+i,1);
    fut.push({label:d.toLocaleDateString("pt-BR",{month:"short"}).replace(".",""), v:mrr, proj:true}); }

// export CSV da lista atual
function exportCSV(){
  const list=S._conds||[];
  if(!list.length) return toast("Nada para exportar.");
  const head=["Nome","Cidade","UF","Status","Unidades","Membros","Síndicos","Criado em"];
  const rows=list.map(c=>[c.nome,c.cidade||"",c.uf||"",c.ativo?"Ativo":"Suspenso",c.unidades,c.membros,(c.sindicos||[]).join(" | "),fmtDate(c.created_at)]);
  const csv=[head,...rows].map(r=>r.map(x=>`"${String(x??"").replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const blob=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download=`vizello-condominios-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  toast("CSV exportado ⬇️");
}

function assinBadge(c){

  const s=c.assinatura_status; if(!s) return plano;

  return `${plano} <span class="badge ${cls}">${ASSIN_LABEL[s]||s}</span>`;
}
function atencaoReasons(c){
  const r=[];
  if(!(c.sindicos&&c.sindicos.length)) r.push("sem síndico");
  if(!c.unidades) r.push("sem unidades");
  if(Number(c.total_vencido)>0) r.push(`${fmtMoney(c.total_vencido)} vencido`);
  if(c.assinatura_status==="atrasada") r.push("assinatura atrasada");
  const dias=c.ultima_atividade?Math.floor((Date.now()-new Date(c.ultima_atividade).getTime())/86400000):null;
  if(dias===null) r.push("sem atividade"); else if(dias>30) r.push(`inativo há ${dias}d`);
  return r;
}
function drawAtencao(conds){
  const el=$("#atencaoWrap"); if(!el) return;
  const items=conds.filter(c=>c.ativo).map(c=>({c,reasons:atencaoReasons(c)})).filter(x=>x.reasons.length);

// ---------- MAPA (Leaflet / OpenStreetMap) ----------
function closeMapWrap(){ $("#mapWrap").classList.remove("show"); if(S._map){ try{ S._map.remove(); }catch(_){}; S._map=null; } }
function initMap(lat,lng,zoom){
  if(S._map){ try{ S._map.remove(); }catch(_){}; S._map=null; }
  const map=L.map("mapEl").setView([lat,lng],zoom);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
  S._map=map; setTimeout(()=>{ try{ map.invalidateSize(); }catch(_){} },160);
  return map;
}
function mapaGeral(){
  if(typeof L==="undefined") return toast("Mapa indisponível (sem conexão).");
  $("#mapTitle").textContent="Mapa dos condomínios";
  $("#mapWrap").classList.add("show");
  const loc=(S._conds||[]).filter(c=>c.lat!=null&&c.lng!=null);
  const semLoc=(S._conds||[]).length-loc.length;
  const map=initMap(loc.length?loc[0].lat:-14.24, loc.length?loc[0].lng:-53.18, loc.length?13:4);
  const bounds=[];
  loc.forEach(c=>{
    const mk=L.marker([c.lat,c.lng]).addTo(map);
    mk.bindPopup(`<b>${esc(c.nome)}</b><br>${c.cidade?esc(c.cidade)+(c.uf?"/"+esc(c.uf):""):""}<br><a href="#" data-detail="${c.id}">Ver detalhes ›</a>`);
    bounds.push([c.lat,c.lng]);
  });
  if(bounds.length>1) map.fitBounds(bounds,{padding:[50,50]});
  map.on("popupopen",e=>{
    const a=e.popup.getElement().querySelector("[data-detail]");
    if(a) a.addEventListener("click",ev=>{ ev.preventDefault(); closeMapWrap(); abrirDetalhe(a.dataset.detail); });
  });
  $("#mapFoot").innerHTML=`<span class="hint">📍 ${loc.length} no mapa${semLoc?` · ${semLoc} sem localização`:""}</span>`;
  $("#mapClose").onclick=closeMapWrap;
}
function mapaDefinir(cond){
  if(typeof L==="undefined") return toast("Mapa indisponível (sem conexão).");
  $("#mapTitle").textContent="Localização — "+(cond.nome||"condomínio");
  $("#mapWrap").classList.add("show");
  const hasLoc=cond.lat!=null&&cond.lng!=null;
  const map=initMap(hasLoc?cond.lat:-14.24, hasLoc?cond.lng:-53.18, hasLoc?15:4);
  let marker=hasLoc?L.marker([cond.lat,cond.lng],{draggable:true}).addTo(map):null;
  const upd=()=>{ const ll=marker.getLatLng(); const el=$("#mapLatLng"); if(el) el.textContent=`${ll.lat.toFixed(5)}, ${ll.lng.toFixed(5)}`; };
  map.on("click",e=>{ if(marker) marker.setLatLng(e.latlng); else { marker=L.marker(e.latlng,{draggable:true}).addTo(map); marker.on("dragend",upd); } upd(); });
  if(marker) marker.on("dragend",upd);
  const temEnd=!!(cond.endereco||cond.cidade);
  $("#mapFoot").innerHTML=`<span class="hint">Toque no mapa para posicionar. <b id="mapLatLng">${hasLoc?cond.lat.toFixed(5)+", "+cond.lng.toFixed(5):"—"}</b></span>
    ${temEnd?'<button class="btn small secondary" id="mapGeo" style="width:auto;margin:0">🔎 Pelo endereço</button>':""}
    <button class="btn small" id="mapSave">Salvar</button>`;
  $("#mapGeo")?.addEventListener("click",async()=>{
    const b=$("#mapGeo"); b.disabled=true; b.textContent="Buscando…";
    try{
      const q=[cond.endereco,cond.cidade,cond.uf,"Brasil"].filter(Boolean).join(", ");
      const ll=await geocodeEndereco(q);
      if(!ll){ toast("Endereço não localizado. Posicione manualmente."); }
      else{ if(marker) marker.setLatLng([ll.lat,ll.lng]); else { marker=L.marker([ll.lat,ll.lng],{draggable:true}).addTo(map); marker.on("dragend",upd); } map.setView([ll.lat,ll.lng],16); upd(); toast("Local encontrado — confira e salve."); }
    }catch(e){ toast(e.message||"Falha na busca"); }
    b.disabled=false; b.textContent="🔎 Pelo endereço";
  });
  $("#mapSave").onclick=async()=>{
    if(!marker) return toast("Toque no mapa para marcar o local.");
    const ll=marker.getLatLng(); $("#mapSave").disabled=true;
    try{ await rpc("plataforma_condominio_local",{p_cond:cond.id,p_lat:ll.lat,p_lng:ll.lng});
      toast("Localização salva ✅"); closeMapWrap(); await renderDashboard();
    }catch(e){ $("#mapSave").disabled=false; toast(e.message); }
  };
  $("#mapClose").onclick=closeMapWrap;
}

function gerarUnidadesModal(d){

    <div style="display:flex;gap:10px;margin-top:16px"><button class="btn secondary" id="guCancel">Cancelar</button><button class="btn" id="guSave">Gerar</button></div>`);
  const prev=()=>{ const n=gerarUnidades(+$("#guBlocos").value,+$("#guAndares").value,+$("#guPorAndar").value);
    const ex=n.slice(0,4).map(u=>(u.bloco?u.bloco+"-":"")+u.numero).join(", ");
    $("#guPrev").innerHTML=`Serão criadas <b style="color:var(--ink)">${n.length}</b> unidade(s). Ex.: ${esc(ex)}${n.length>4?"…":""}`; };
  ["guBlocos","guAndares","guPorAndar"].forEach(id=>$("#"+id).addEventListener("input",prev)); prev();
  $("#guCancel").addEventListener("click",closeModal);
  $("#guSave").addEventListener("click",async()=>{
    const lista=gerarUnidades(+$("#guBlocos").value,+$("#guAndares").value,+$("#guPorAndar").value);

function maskCnpj(v){ v=(v||"").replace(/\D/g,"").slice(0,14);
  return v.replace(/^(\d{2})(\d)/,"$1.$2").replace(/^(\d{2})\.(\d{3})(\d)/,"$1.$2.$3")
          .replace(/\.(\d{3})(\d)/,".$1/$2").replace(/(\d{4})(\d)/,"$1-$2"); }
async function buscarCnpj(){
  const raw=($("#ncCnpj").value||"").replace(/\D/g,""), st=$("#ncCnpjSt"), btn=$("#ncBuscar");
  const setSt=(m,c)=>{ st.innerHTML=m; st.style.color=c; };
  if(raw.length!==14){ setSt("Digite os 14 dígitos do CNPJ.","var(--danger)"); return; }
  setSt("Buscando dados na Receita…","var(--muted)"); btn.disabled=true;
  try{
    const res=await fetch(`https://brasilapi.com.br/api/cnpj/v1/${raw}`);
    if(!res.ok) throw new Error(res.status===404?"CNPJ não encontrado na base.":"Falha na consulta ("+res.status+").");
    const d=await res.json();
    const nome=(d.razao_social&&d.razao_social.trim())||(d.nome_fantasia&&d.nome_fantasia.trim())||"";
    $("#ncNome").value=nome;
    $("#ncCidade").value=d.municipio||"";
    $("#ncUf").value=(d.uf||"").toUpperCase();
    let end=[d.logradouro,d.numero].filter(Boolean).join(", ");
    if(d.complemento&&d.complemento.trim()) end+=` - ${d.complemento.trim()}`;
    if(d.bairro) end+=` - ${d.bairro}`;
    if(d.cep) end+=` - CEP ${String(d.cep).replace(/(\d{5})(\d{3})/,"$1-$2")}`;
    $("#ncEnd").value=end.replace(/^[,\s-]+/,"").trim();
    const cep=$("#ncCep"); if(cep) cep.value=d.cep?String(d.cep).replace(/\D/g,"").replace(/(\d{5})(\d{3})/,"$1-$2"):"";
    const tel=$("#ncTel"); if(tel && d.ddd_telefone_1){ const t=String(d.ddd_telefone_1).replace(/\D/g,""); tel.value=t.length>=10?t.replace(/^(\d{2})(\d{4,5})(\d{4})$/,"($1) $2-$3"):d.ddd_telefone_1; }
    const situ=(d.descricao_situacao_cadastral||"").toUpperCase();
    if(situ && situ!=="ATIVA") setSt(`⚠️ Dados preenchidos — situação cadastral: <b>${esc(situ)}</b>`,"var(--warn)");
    else setSt("✅ Dados preenchidos. Confira e cadastre.","var(--ok)");
  }catch(e){
    setSt(/Failed to fetch|NetworkError/i.test(e.message)?"Sem conexão com o serviço de CNPJ. Preencha manualmente.":esc(e.message),"var(--danger)");
  }
  btn.disabled=false;
}
// --- Geocoding (endereço -> lat/lng via Nominatim/OpenStreetMap) ---
async function geocodeEndereco(q){
  if(!q||!q.trim()) return null;
  const url=`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=br&addressdetails=0&q=${encodeURIComponent(q.trim())}`;
  const res=await fetch(url,{headers:{Accept:"application/json"}});
  if(!res.ok) throw new Error("Falha no geocoding ("+res.status+")");
  const arr=await res.json();
  if(!arr||!arr.length) return null;
  const lat=parseFloat(arr[0].lat), lng=parseFloat(arr[0].lon);
  return (isFinite(lat)&&isFinite(lng))?{lat,lng}:null;
}
// --- Gerador de unidades em massa ---
function letraBloco(i){ let s="",n=i+1; while(n>0){ n--; s=String.fromCharCode(65+(n%26))+s; n=Math.floor(n/26); } return s; }
function gerarUnidades(blocos, andares, porAndar){
  blocos=Math.max(1,Math.min(50,blocos|0)); andares=Math.max(1,Math.min(99,andares|0)); porAndar=Math.max(1,Math.min(99,porAndar|0));
  const out=[];
  for(let b=0;b<blocos;b++){ const bloco= blocos>1? letraBloco(b): null;
    for(let a=1;a<=andares;a++) for(let u=1;u<=porAndar;u++) out.push({bloco, numero:String(a*100+u)}); }
  return out;
}

  modal(`<h2>Novo condomínio</h2><p class="sub">Informe o CNPJ para puxar os dados automaticamente — ou preencha à mão.</p>

      <div id="ncUnBox" class="hide" style="margin-top:12px">
        <div style="display:flex;gap:8px">
          <div style="flex:1"><label style="margin-top:0">Blocos</label><input id="ncBlocos" class="field" inputmode="numeric" value="1"></div>
          <div style="flex:1"><label style="margin-top:0">Andares</label><input id="ncAndares" class="field" inputmode="numeric" value="4"></div>
          <div style="flex:1"><label style="margin-top:0">Aptos/andar</label><input id="ncPorAndar" class="field" inputmode="numeric" value="4"></div>
        </div>
        <div id="ncUnPrev" class="meta" style="margin:8px 2px 0"></div>
      </div>
    </div>
    <label style="display:flex;align-items:center;gap:10px;margin-top:14px;cursor:pointer;color:var(--ink)"><span class="switch on" id="ncGeo"></span> Localizar no mapa pelo endereço</label>
    <div style="display:flex;gap:10px;margin-top:14px">
      <button class="btn secondary" id="ncCancel">Cancelar</button>
      <button class="btn" id="ncSave">Cadastrar</button></div>`);
  $("#ncCnpj").addEventListener("input",e=>{ e.target.value=maskCnpj(e.target.value); });
  $("#ncCnpj").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); buscarCnpj(); } });
  $("#ncBuscar").addEventListener("click",buscarCnpj);
  let gerUn=false, geo=true;
  const prev=()=>{ const n=gerarUnidades(+$("#ncBlocos").value,+$("#ncAndares").value,+$("#ncPorAndar").value);
    const ex=n.slice(0,3).map(u=>(u.bloco?u.bloco+"-":"")+u.numero).join(", ");
    $("#ncUnPrev").innerHTML=`Serão criadas <b style="color:var(--ink)">${n.length}</b> unidade(s). Ex.: ${esc(ex)}${n.length>3?"…":""}`+(n.length>1500?' <span style="color:var(--warn)">(muitas — pode demorar)</span>':""); };
  $("#ncGerUn").addEventListener("click",()=>{ gerUn=!gerUn; $("#ncGerUn").classList.toggle("on",gerUn); $("#ncUnBox").classList.toggle("hide",!gerUn); if(gerUn) prev(); });
  ["ncBlocos","ncAndares","ncPorAndar"].forEach(id=>$("#"+id).addEventListener("input",prev));
  $("#ncGeo").addEventListener("click",()=>{ geo=!geo; $("#ncGeo").classList.toggle("on",geo); });
  $("#ncCep").addEventListener("input",e=>{ e.target.value=e.target.value.replace(/\D/g,"").slice(0,8).replace(/(\d{5})(\d)/,"$1-$2"); });
  $("#ncCancel").addEventListener("click",closeModal);
  $("#ncSave").addEventListener("click",async()=>{
    const nome=$("#ncNome").value.trim(); if(!nome) return toast("Informe o nome.");
    const cnpj=($("#ncCnpj").value||"").replace(/\D/g,"");
    if(cnpj && cnpj.length!==14) return toast("CNPJ inválido (14 dígitos).");
    const endereco=$("#ncEnd").value.trim(), cidade=$("#ncCidade").value.trim(), uf=$("#ncUf").value.trim();
    const btn=$("#ncSave"); btn.disabled=true; btn.textContent="Cadastrando…";
    try{
      const r=await rpc("plataforma_condominio_criar",{p_nome:nome,p_cidade:cidade||null,p_uf:uf||null,
        p_sindico_email:$("#ncSind").value.trim()||null,p_cnpj:cnpj||null,p_endereco:endereco||null,
        p_cep:($("#ncCep").value||"").replace(/\D/g,"")||null,p_telefone:$("#ncTel").value.trim()||null});
      let extra="";
      if(gerUn){
        const lista=gerarUnidades(+$("#ncBlocos").value,+$("#ncAndares").value,+$("#ncPorAndar").value);
        if(lista.length){ btn.textContent="Criando unidades…";
          try{ const n=await rpc("plataforma_unidades_criar",{p_cond:r.id,p_unidades:lista}); extra=` · ${n} unidade(s)`; }
          catch(e){ console.error(e); extra=" · (falha ao gerar unidades)"; } }
      }
      if(geo && (endereco||cidade)){ btn.textContent="Localizando…";
        try{ const q=[endereco,cidade,uf,"Brasil"].filter(Boolean).join(", ");
          const ll=await geocodeEndereco(q);
          if(ll){ await rpc("plataforma_condominio_local",{p_cond:r.id,p_lat:ll.lat,p_lng:ll.lng}); extra+=" · 📍 no mapa"; } }
        catch(e){ console.error(e); }
      }
      closeModal();
      toast((r.status==="sindico_vinculado"?"Criado e síndico vinculado ✅"
        : r.status==="sindico_convidado"?"Criado; síndico convidado ✉️"
        : "Condomínio criado ✅")+extra);
      renderDashboard();
    }catch(e){ btn.disabled=false; btn.textContent="Cadastrar"; toast(e.message); }
  });
}
